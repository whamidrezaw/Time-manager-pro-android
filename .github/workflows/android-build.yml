name: Android Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build APK (Debug)
      run: ./gradlew assembleDebug || gradle assembleDebug

    - name: Build AAB (Release)
      run: ./gradlew bundleRelease || gradle bundleRelease

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: TimeManager-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Release AAB
      uses: actions/upload-artifact@v4
      with:
        name: TimeManager-Release-AAB
        path: app/build/outputs/bundle/release/app-release-unsigned.aab
